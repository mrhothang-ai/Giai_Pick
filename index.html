,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--pl:#38003c;--pl2:#240028;--pl3:#5b1a62;--mag:#e90052;--grn:#00ff85;--cy:#04f5ff;--bg:#f1edf4;--mut:#7d6b84;--line:#e3dbe8;--ok:#0a9a56;--warn:#d98b00;--bad:#d6164a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--pl)}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--pl);max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(86px + env(safe-area-inset-bottom));font-weight:500;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hd{background:linear-gradient(135deg,#4a0a52 0%,var(--pl) 55%,var(--pl2) 100%);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px;position:relative;overflow:hidden}
.hd:before{content:'';position:absolute;right:-60px;top:-40px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(4,245,255,.55),rgba(4,245,255,0) 70%)}
.hd:after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--grn),var(--cy) 50%,var(--mag))}
.hd>*{position:relative;z-index:1}
.eb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eb small{font-size:12px;font-weight:800;color:var(--grn);letter-spacing:.3px}
.pill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block}
.pill.bad i{background:var(--mag)}
.pill.warn i{background:#ffb020}
h1{font-weight:800;font-size:34px;line-height:1.02;margin-top:8px;letter-spacing:-.5px}
h1 span{color:var(--grn)}
.sub{font-size:12.5px;font-weight:600;color:#d8c8dc;margin-top:6px}
.prog{margin-top:13px;height:7px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.prog div{height:100%;background:var(--grn);width:0;border-radius:9px;transition:width .4s}
.ptxt{font-size:12px;font-weight:700;margin-top:6px;color:#efe3f2}
main{padding:14px 12px 0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;background:#fff;padding:5px;border-radius:99px;border:1px solid var(--line)}
.tab{border-radius:99px;padding:8px 2px;text-align:center;font-weight:800;font-size:13px;line-height:1.15;color:var(--pl)}
.tab small{display:block;font-size:10.5px;font-weight:600;opacity:.7}
.tab.on{background:var(--pl);color:var(--grn)}
.tab.on small{opacity:.9}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;gap:8px}
.sec h2{font-weight:800;font-size:21px;letter-spacing:-.3px}
.sec span.m{font-size:12px;color:var(--mut);font-weight:700}
.shot{display:flex;align-items:center;gap:6px;background:var(--mag);color:#fff;font-weight:800;font-size:12.5px;padding:8px 13px;border-radius:99px;white-space:nowrap}
.shot svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rh{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 7px}
.rh b{background:var(--pl);color:var(--grn);font-size:12px;font-weight:800;padding:4px 12px;border-radius:99px}
.rh span{font-size:12px;font-weight:700;color:var(--mut);text-align:right}
.fx{display:block;width:100%;text-align:left;background:#fff;border-radius:14px;margin-bottom:7px;padding:8px 10px 10px;border:1px solid var(--line);position:relative}
.fx.next{border-color:var(--grn);box-shadow:inset 5px 0 0 var(--grn)}
.fx-n{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:var(--mut);margin-bottom:5px}
.fx-n em{font-style:normal;color:var(--ok)}
.fx-r{display:flex;align-items:center;gap:8px}
.hm,.aw{flex:1;min-width:0;font-size:14.5px;font-weight:700;line-height:1.2;word-break:break-word}
.hm{text-align:right}.aw{text-align:left}
.fx.done .hm,.fx.done .aw{color:#8c7d92;font-weight:600}
.fx.done .hm.w,.fx.done .aw.w{color:var(--pl);font-weight:800}
.sc{flex:none;min-width:78px;text-align:center;background:var(--pl);color:#fff;border-radius:9px;padding:7px 8px;font-weight:800;font-size:19px;letter-spacing:.5px}
.sc i{font-style:normal;color:var(--grn);margin:0 4px}
.sc.go{background:#fff;color:var(--pl);border:2px solid var(--pl);font-size:13px;padding:6px 8px;letter-spacing:0}
.card{background:#fff;border-radius:18px;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card b.t{font-size:16px;font-weight:800}
.rt{width:100%;border-collapse:collapse}
.rt th{font-size:11px;color:var(--mut);font-weight:700;padding:0 3px 7px;text-align:center}
.rt th.l{text-align:left}
.rt td{padding:10px 3px;text-align:center;font-weight:700;font-size:15px;border-top:1px solid var(--line)}
.rt td.tm{text-align:left;font-weight:800;font-size:14.5px}
.rt td.rk{font-weight:800;font-size:15px;width:36px}
.rt tr.q td:first-child{box-shadow:inset 5px 0 0 var(--grn)}
.rt tr.pv td:first-child{box-shadow:inset 5px 0 0 #b9efd5}
.rt td.pt{font-weight:800}
.fm{display:flex;gap:3px;margin-top:4px}
.fm i{width:9px;height:9px;border-radius:50%;background:#d9cfde;display:block}
.fm i.w{background:var(--ok)}.fm i.l{background:var(--mag)}

 if(mx>=16&&mx<=18&&mx-mn===2)return{ok:true,msg:'Hợp lệ (cách biệt 2 điểm)'};
 if(mx===19&&(mn===17||mn===18))return{ok:true,msg:'Hợp lệ (chạm trần 19 điểm)'};
 return{ok:false,msg:'Vòng trong: chạm 15 và hơn 2 điểm, hoặc cách biệt 2 điểm (tối đa 19)'};
}

/* ---------- xếp hạng ---------- */
function groupBy(arr,f){var o={};arr.forEach(function(x){var k=f(x);(o[k]=o[k]||[]).push(x);});return o;}
function keysDesc(o){return Object.keys(o).map(Number).sort(function(a,b){return b-a;});}
function drawOrder(g){var r=S.res['draw:'+g];if(!r||!r.note)return[];try{return JSON.parse(r.note)||[];}catch(e){return[];}}
var CACHE={};
function calc(g){
 var ms=gmatches(g),played=ms.filter(function(m){return has(m.id);});
 var st={};TEAMS[g].forEach(function(_,i){st[g+(i+1)]={t:g+(i+1),p:0,w:0,l:0,pf:0,pa:0,d:0,form:[]};});
 played.forEach(function(m){var r=S.res[m.id],a=st[m.t1],b=st[m.t2];
  a.p++;b.p++;a.pf+=r.a;a.pa+=r.b;b.pf+=r.b;b.pa+=r.a;
  if(r.a>r.b){a.w++;b.l++;a.form.push('w');b.form.push('l');}else{b.w++;a.l++;a.form.push('l');b.form.push('w');}});
 var ids=Object.keys(st);ids.forEach(function(t){st[t].d=st[t].pf-st[t].pa;});
 var complete=played.length===ms.length,draw=drawOrder(g),ties=[];
 function drawRes(grp){
  var ok=grp.every(function(t){return draw.indexOf(t)>=0;});
  if(ok)return grp.slice().sort(function(x,y){return draw.indexOf(x)-draw.indexOf(y);});
  if(complete)ties.push(grp);return grp;
 }
 function diffRes(grp){
  if(grp.length===1)return grp;
  var sub=groupBy(grp,function(t){return st[t].d;}),out=[];
  keysDesc(sub).forEach(function(k){out=out.concat(sub[k].length>1?drawRes(sub[k]):sub[k]);});
  return out;
 }
 function h2h(grp){
  if(grp.length===1)return grp;
  var hw={};grp.forEach(function(t){hw[t]=0;});
  played.forEach(function(m){if(grp.indexOf(m.t1)>=0&&grp.indexOf(m.t2)>=0){var r=S.res[m.id];hw[r.a>r.b?m.t1:m.t2]++;}});
  var sub=groupBy(grp,function(t){return hw[t];}),ks=keysDesc(sub);
  if(ks.length===1)return diffRes(grp);
  var out=[];ks.forEach(function(k){out=out.concat(sub[k].length>1?h2h(sub[k]):sub[k]);});
  return out;
 }
 var byW=groupBy(ids,function(t){return st[t].w;}),order=[];
 keysDesc(byW).forEach(function(k){order=order.concat(h2h(byW[k]));});
 var blocked=false;
 ties.forEach(function(s){var lo=Math.min.apply(null,s.map(function(t){return order.indexOf(t);}));if(lo<=1)blocked=true;});
 return{st:st,order:order,complete:complete,ties:ties,blocked:blocked,ready:complete&&!blocked,count:played.length};
}
function recalc(){CACHE={};GROUPS.forEach(function(g){CACHE[g]=calc(g);});}

  if(c.ready)return{team:c.order[s.p],label:lab};
  return{team:null,label:lab,prov:c.count>0?c.order[s.p]:null};

 var lab=(s.k==='w'?'Thắng ':'Thua ')+m.lab.replace('Bán kết ','BK');

 return o;
}

/* ---------- CSV ---------- */
function csvq(v){v=v==null?'':String(v);return /[",\r\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildRows(){
 recalc();
 var rows=[['ma','vong','doi_1','doi_2','diem_1','diem_2','boc_tham']];
 GROUPS.forEach(function(g){gmatches(g).forEach(function(m){var r=S.res[m.id];
  rows.push([m.id,'Bảng '+g+' - Trận '+m.n+' (Lượt '+(m.r+1)+')',tname(m.t1),tname(m.t2),r&&r.a!=null?r.a:'',r&&r.b!=null?r.b:'','']);});});
 KO.forEach(function(m){var a=slot(m.s1),b=slot(m.s2),r=S.res[m.id];
  rows.push([m.id,'Giải '+m.gi+' - '+m.lab,a.team?tname(a.team):a.label,b.team?tname(b.team):b.label,r&&r.a!=null?r.a:'',r&&r.b!=null?r.b:'','']);});
 GROUPS.forEach(function(g){var r=S.res['draw:'+g];if(r&&r.note)rows.push(['draw:'+g,'Bốc thăm bảng '+g,'','','','',r.note]);});
 ATH.forEach(function(a){var r=S.res['thu:'+a.id];rows.push(['thu:'+a.id,'Thu VĐV - Bảng '+a.g,a.name,a.team,r&&r.a>0?r.a:'',r&&r.b>0?r.b:'',r&&r.note||'']);});
 finIds('thukhac:').forEach(function(k){var r=S.res[k];rows.push([k,'Thu khác / tài trợ ngoài',r.p||'',r.q||'',r.a||'','',r.note||'']);});
 finIds('chi:').forEach(function(k){var r=S.res[k];rows.push([k,'Chi',r.p||'',r.q||'',r.a||'','',r.note||'']);});
 return rows;
}
function toCSV(){
 var rows=buildRows();
 rows.push(['meta:updated','Thời điểm xuất file',new Date().toISOString(),'','','','']);
 return '\uFEFF'+rows.map(function(r){return r.map(csvq).join(',');}).join('\r\n')+'\r\n';
}
function parseCSV(text){
 text=String(text||'').replace(/^\uFEFF/,'');
 var first=text.split(/\r?\n/)[0]||'',del=first.split(';').length>first.split(',').length?';':',';
 var rows=[],row=[],f='',q=false,i,c;
 for(i=0;i<text.length;i++){c=text.charAt(i);
  if(q){if(c==='"'){if(text.charAt(i+1)==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true;
  else if(c===del){row.push(f);f='';}
  else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
  else if(c!=='\r')f+=c;}
 if(f!==''||row.length){row.push(f);rows.push(row);}
 return rowsToRes(rows);
}
function rowsToRes(rows){
 rows=rows.slice();
 var hd=(rows.shift()||[]).map(function(h){return String(h).trim().toLowerCase();});
 function ix(n,d){var k=hd.indexOf(n);return k<0?d:k;}
 var I={ma:ix('ma',0),d1:ix('doi_1',2),a:ix('diem_1',4),b:ix('diem_2',5),n:ix('boc_tham',6)};
 var res={},upd=null;
 rows.forEach(function(r){var id=(r[I.ma]||'').trim();if(!id)return;
  if(id==='meta:updated'){upd=(r[I.d1]||'').trim();return;}
  if(id.indexOf('draw:')===0){var nt=(r[I.n]||'').trim();if(nt&&/^draw:[A-D]$/.test(id))res[id]={a:null,b:null,note:nt};return;}
  var fm=/^(thu|thukhac|chi):(.+)$/.exec(id);
  if(fm){
   if(fm[1]==='thu'&&!ATH.some(function(x){return x.id===fm[2];}))return;
   if(fm[1]!=='thu'&&!/^\d+$/.test(fm[2]))return;
   var ma=num(r[I.a]),mb=num(r[I.b]),nt2=(r[I.n]||'').trim();
   if(fm[1]==='thu'){if(!(ma>0)&&!(mb>0)&&!nt2)return;res[id]={a:ma>0?ma:null,b:mb>0?mb:null,note:nt2};}
   else{if(!(ma>0))return;res[id]={a:ma,b:null,note:nt2,p:(r[I.d1]||'').trim(),q:(r[I.d1+1]||'').trim()};}
   return;
  }
  if(!(/^[A-D]-([1-9]|10)$/.test(id)||KOM[id]))return;
  var a=parseInt(r[I.a],10),b=parseInt(r[I.b],10);
  if(isNaN(a)||isNaN(b)||a<0||b<0||a>19||b>19||a===b)return;
  res[id]={a:a,b:b,note:null};});
 return{res:res,updated:upd,count:Object.keys(res).length};
}
function cleanName(v){
 v=String(v||'').replace(/[\\\/:*?"<>|]+/g,'').trim();
 if(!v)v=CSV_FILE;
 if(!/\.csv$/i.test(v))v+='.csv';
 return v;
}
function csvName(){
 var el=$('csvn'),v=cleanName(el?el.value:S.csvName);
 S.csvName=v;if(el)el.value=v;
 try{localStorage.setItem(STORE+'-csvname',v);}catch(e){}
 return v;
}
function csvFileObj(name){try{return new File([toCSV()],name||CSV_FILE,{type:'text/csv'});}catch(e){return null;}}
function dlCSV(name,text){
 name=name||csvName();text=text||toCSV();
 var blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
 setTimeout(function(){URL.revokeObjectURL(url);},5000);toast('Đã tải xuống '+name);
}
function shareCSV(){
 var name=csvName(),f=csvFileObj(name);
 if(f&&navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share)navigator.share({files:[f],title:name}).catch(function(){});
 else{dlCSV(name);}
}
function fallbackSave(name,text){
 var n=prompt('Đặt tên file để lưu (đuôi .csv):',name);
 if(n===null)return;
 n=cleanName(n);S.csvName=n;try{localStorage.setItem(STORE+'-csvname',n);}catch(e){}
 var el=$('csvn');if(el)el.value=n;
 dlCSV(n,text);
}
function saveCSV(){
 var name=csvName(),text=toCSV();
 if(window.showSaveFilePicker){
  window.showSaveFilePicker({suggestedName:name,types:[{description:'CSV',accept:{'text/csv':['.csv']}}]}).then(function(h){
   return h.createWritable().then(function(w){return w.write(new Blob([text],{type:'text/csv'})).then(function(){return w.close();});}).then(function(){toast('Đã lưu '+(h.name||name));});
  }).catch(function(e){if(e&&e.name==='AbortError')return;fallbackSave(name,text);});
  return;
 }
 var f=csvFileObj(name);
 if(f&&navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){
  navigator.share({files:[f],title:name}).catch(function(e){if(e&&e.name==='AbortError')return;fallbackSave(name,text);});
  return;
 }
 fallbackSave(name,text);
}
function importCSV(text,srcLabel){
 var p=parseCSV(text);
 if(!p.count&&!/ma\s*[,;]/i.test(String(text).slice(0,40))){toast('File không đúng định dạng CSV của giải');return;}
 if(Object.keys(S.local).length&&!confirm('Nạp '+p.count+' kết quả từ '+srcLabel+' sẽ thay toàn bộ kết quả trên máy. Tiếp tục?'))return;
 S.local=p.res;S.res=S.local;persist();render();toast('Đã nạp '+p.count+' kết quả');
}

function fetchRemote(){

/* ---------- Google Sheet (Apps Script) ---------- */
var sbusy=false,sagain=false;
function SURL(){return (SHEET_URL||S.sheetUrl||'').trim();}
function canon(r){return r?[r.a==null?'':r.a,r.b==null?'':r.b,r.note||'',r.p||'',r.q||''].join('|'):'';}
function errMsg(e){
 var m=String(e&&e.message||e||'');
 if(e&&e.name==='SyntaxError')return 'Link chưa đúng hoặc chưa Deploy ở chế độ Anyone';
 if(e&&e.name==='AbortError')return 'Quá thời gian chờ';
 if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Không có mạng hoặc link sai';
 return m.slice(0,90);
}
function fetchJSON(url,opt,ms){
 var ctl=typeof AbortController!=='undefined'?new AbortController():null,tm=null;
 if(ctl){opt.signal=ctl.signal;tm=setTimeout(function(){ctl.abort();},ms||15000);}
 return fetch(url,opt).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();},function(e){clearTimeout(tm);throw e;});
}
function sheetPost(payload,url,key){
 payload.key=key!=null?key:S.key;
 return fetchJSON(url||SURL(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'}).then(function(j){
  if(!j||!j.ok)throw new Error((j&&j.error)||'Máy chủ từ chối');return j;});
}
function changedIds(){
 var ids={},ups=[];
 Object.keys(S.local).forEach(function(k){ids[k]=1;});Object.keys(S.synced).forEach(function(k){ids[k]=1;});
 Object.keys(ids).forEach(function(id){if(canon(S.local[id])!==(S.synced[id]||''))ups.push(id);});
 return{ups:ups};
}
function rowDict(){var d={};buildRows().slice(1).forEach(function(r){d[r[0]]=r;});return d;}
function pushNow(){
 var ch=changedIds().ups;if(!ch.length)return Promise.resolve(false);
 var dict=rowDict(),ops=[],dels=[],sent={};
 ch.forEach(function(id){sent[id]=canon(S.local[id]);if(dict[id])ops.push(dict[id]);else dels.push(id);});
 return sheetPost({ops:ops,del:dels}).then(function(){
  ch.forEach(function(id){if(sent[id])S.synced[id]=sent[id];else delete S.synced[id];});
  persist(true);return true;});
}
function fullPush(){
 var rows=buildRows();rows.shift();
 var sent={};Object.keys(S.local).forEach(function(k){var c=canon(S.local[k]);if(c)sent[k]=c;});
 return sheetPost({replace:true,rows:rows}).then(function(){S.synced=sent;persist(true);});
}
function pullSheet(){
 var u=SURL();
 return fetchJSON(u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now(),{method:'GET'},10000).then(function(j){
  if(!j||!j.ok)throw new Error((j&&j.error)||'Lỗi đọc dữ liệu');
  S.pulledAt=Date.now();
  var rows=(j.rows||[]).map(function(r){return r.map(function(c){return c==null?'':String(c);});});
  var p=rowsToRes(rows),before=JSON.stringify([S.remote,S.local]);
  S.remote=p.res;S.updated=j.updated||p.updated;S.remoteAt=Date.now();
  S.remoteState=(p.count||rows.length>1)?'ok':'empty';
  if(S.btc){
   var ids={};[p.res,S.local,S.synced].forEach(function(o){Object.keys(o).forEach(function(k){ids[k]=1;});});
   Object.keys(ids).forEach(function(id){
    if(canon(S.local[id])!==(S.synced[id]||''))return;
    if(p.res[id]){S.local[id]=p.res[id];S.synced[id]=canon(p.res[id]);}
    else{delete S.local[id];delete S.synced[id];}
   });
   S.res=S.local;persist(true);
  }else S.res=S.remote;
  try{localStorage.setItem(STORE+'-remote',JSON.stringify({res:S.remote,updated:S.updated}));}catch(e){}
  return{changed:JSON.stringify([S.remote,S.local])!==before,rows:rows.length};
 });
}
var stoken=0,sbusyAt=0;
function syncSheet(){
 if(!SURL())return Promise.resolve();
 if(sbusy&&Date.now()-sbusyAt>20000){sbusy=false;}   // yêu cầu cũ bị treo (iOS tạm dừng trang): bỏ qua và làm lại
 if(sbusy){sagain=true;return Promise.resolve();}
 sbusy=true;sbusyAt=Date.now();var mine=++stoken,info=null,prevView=S.remoteState+'|'+S.sync.st;
 var p=Promise.resolve();
 if(S.btc&&S.key)p=pushNow();
 return p.then(pullSheet).then(function(i){
  info=i;S.sync.st='ok';S.sync.t=Date.now();S.sync.msg='';
  var seed=S.btc&&S.key&&i.rows<=1&&!S.seeding;
  if(seed){S.seeding=true;return fullPush().then(function(){S.seeding=false;toast('Đã tạo dữ liệu trên Google Sheet');},function(e){S.seeding=false;throw e;});}
 }).then(function(){
  var first=!S.shown;S.shown=true;
  if(first||(info&&info.changed)||prevView!==(S.remoteState+'|'+S.sync.st))refreshView();else renderPill();
 }).catch(function(e){
  S.sync.st='err';S.sync.msg=errMsg(e);S.remoteState=S.remoteState==='ok'?'ok':'err';
  if(prevView!==(S.remoteState+'|'+S.sync.st))refreshView();else renderPill();
 }).then(function(){if(mine===stoken){sbusy=false;}if(sagain){sagain=false;setTimeout(syncSheet,300);}});
}
function pushSoon(){
 if(!S.btc||!SURL()||!S.key)return;
 clearTimeout(pushSoon.h);pushSoon.h=setTimeout(syncSheet,500);
}
function tick(){if(SURL())syncSheet();else if(!S.btc)fetchRemote();}

var PAL={pl:'#38003c',pl2:'#240028',pl3:'#5b1a62',mag:'#e90052',grn:'#00ff85',cy:'#04f5ff',mut:'#8a7a90',line:'#e3dbe8'};

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function T(c,s,x,y,size,weight,color,align,maxW){
 size=size;c.textBaseline='middle';c.textAlign=align||'left';c.fillStyle=color;
 do{c.font=weight+' '+size+'px '+FONT;if(!maxW||c.measureText(s).width<=maxW||size<=12)break;size-=1;}while(true);
 c.fillText(s,x,y);
}
function wrap2(c,s,maxW,size,weight){ // tách tối đa 2 dòng ở " - "
 c.font=weight+' '+size+'px '+FONT;
 if(c.measureText(s).width<=maxW)return[s];

}

 else{T(c,L[0],x,cy-size*0.62,size,weight,color,align,maxW);T(c,L[1],x,cy+size*0.62,size,weight,color,align,maxW);}

  },function(er){toast('Chưa kết nối được: '+errMsg(er));});}
 else if(a==='sheettest'){toast('Đang kiểm tra...');
  fetchJSON(SURL()+(SURL().indexOf('?')<0?'?':'&')+'action=ping',{method:'GET'},12000).then(function(){return sheetPost({action:'check'});}).then(function(){toast('Kết nối tốt, mã BTC đúng ✅');},function(er){toast('Lỗi: '+errMsg(er));});}
 else if(a==='sheetsync'){closeSheet();toast('Đang đồng bộ...');syncSheet().then(function(){if(S.sync.st==='ok')toast('Đã đồng bộ');});}
 else if(a==='sheetdiff')diffSheet();
 else if(a==='sheetpush'){if(!confirm('Ghi đè toàn bộ Google Sheet bằng dữ liệu trên máy này?'))return;
  toast('Đang gửi...');fullPush().then(function(){render();toast('Đã đẩy toàn bộ lên Sheet');},function(er){toast('Lỗi: '+errMsg(er));});}
 else if(a==='sheetoff'){if(!confirm('Ngắt kết nối Google Sheet? Dữ liệu trên máy vẫn giữ.'))return;
  S.sheetUrl='';S.key='';S.synced={};try{localStorage.removeItem(STORE+'-sheet');localStorage.removeItem(STORE+'-key');}catch(er){}persist(true);render();toast('Đã ngắt kết nối');}
 else if(a==='finsave')finSave();
 else if(a==='findel'){delete S.res[D.id];persist();closeSheet();render();toast('Đã xóa khoản');}
 else if(a==='copyacc')copy(BANK.acc,'Đã sao chép số tài khoản');
 else if(a==='csvsave')saveCSV();
 else if(a==='csvdl')dlCSV();
 else if(a==='csvshare')shareCSV();
 else if(a==='csvcopy')copy(toCSV().replace(/^\uFEFF/,''),'Đã sao chép nội dung CSV');
 else if(a==='csvgh'){fetchRemote().then(function(t){if(t==null){toast('Chưa có file '+CSV_FILE+' trên GitHub');return;}importCSV(t,'GitHub');});}
 else if(a==='csvfile'){$('csvf').value='';$('csvf').click();}
 else if(a==='csvpaste'){var tv=$('csvt').value;if(!tv.trim()){toast('Chưa dán nội dung');return;}importCSV(tv,'nội dung dán');}
 else if(a==='wipe'){
  var v=prompt('Gõ XOA để xóa toàn bộ kết quả và số liệu tài chính trên máy này');if(v==null||v.trim().toUpperCase()!=='XOA')return;
  S.local={};S.res=S.local;persist();render();toast('Đã xóa toàn bộ');}
}
document.addEventListener('input',function(e){
 var t=e.target;if(!D||!D.ctx||(t.id!=='ina'&&t.id!=='inb'))return;
 var k=t.id.charAt(2),v=t.value===''?null:Math.max(0,Math.min(19,parseInt(t.value,10)));
 if(v!=null&&isNaN(v))v=null;D[k]=v;if(v!=null&&String(v)!==t.value)t.value=v;upd();
});

document.addEventListener('input',function(e){
 if(e.target.id==='f_a'||e.target.id==='f_b'){pvUpd();return;}
 if(e.target.id==='q'){S.q=e.target.value;var o=$('ovl');if(o)o.innerHTML=allHTML();}
});
document.addEventListener('change',function(e){
 if(e.target.id==='csvn'){csvName();return;}
 if(e.target.id==='csvf'&&e.target.files&&e.target.files[0]){
  var rd=new FileReader();rd.onload=function(){importCSV(String(rd.result),'file');};rd.readAsText(e.target.files[0],'utf-8');}
});
/* ---------- khởi động ---------- */
load();
var hm=location.hash.match(/sheet=([^&]+)/);
if(hm){try{S.sheetUrl=decodeURIComponent(hm[1]);localStorage.setItem(STORE+'-sheet',S.sheetUrl);history.replaceState(null,'',location.href.split('#')[0]);}catch(e){}}
if(S.btc&&SURL()&&!S.key){S.btc=false;S.res=S.remote;}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
window.__app={diffSheet:diffSheet,refreshView:refreshView,syncSheet:syncSheet,changedIds:changedIds,fullPush:fullPush,SURL:SURL,finCalc:finCalc,ATH:ATH,saveCSV:saveCSV,cleanName:cleanName,toCSV:toCSV,parseCSV:parseCSV,allHTML:allHTML,fetchRemote:fetchRemote,S:S,CACHE:function(){return CACHE;},slot:slot,podium:podium,validate:validate,render:render,persist:persist,summary:summary,gmatches:gmatches,composeImage:composeImage,loadFonts:loadFonts,ROUNDS:ROUNDS};
render();loadFonts();
tick();
function stale(ms){return Date.now()-(S.pulledAt||S.remoteAt||0)>ms;}
setInterval(function(){if(document.visibilityState!=='hidden')tick();},15000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')tick();});
window.addEventListener('pageshow',function(){tick();});
window.addEventListener('focus',function(){if(stale(5000))tick();});
window.addEventListener('online',tick);
document.addEventListener('touchstart',function(){if(SURL()&&stale(12000))tick();},{passive:true});
})();
</script>
</body>
</html>
